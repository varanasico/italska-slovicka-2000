<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b5502e">
<title>Italská slovíčka — kartičky</title>
<style>
  :root{
    --bg:#f4f1ea;
    --card-bg:#ffffff;
    --card-border:#d8d2c4;
    --text:#2b2620;
    --muted:#7a7364;
    --accent:#b5502e;
    --accent-dark:#8f3d21;
    --accent-2:#3b6e5e;
    --shadow: 0 10px 30px rgba(0,0,0,.10);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1815;
      --card-bg:#242019;
      --card-border:#3a332a;
      --text:#f0ece2;
      --muted:#a89f8e;
      --accent:#e07a52;
      --accent-dark:#c9663f;
      --accent-2:#6fae98;
      --shadow: 0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app{
    height:100dvh;
    height:100svh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 14px);
    overflow-y:auto;
  }

  /* ---- top bar: kept to two thin rows so the card+controls always have room ---- */
  .topbar{ flex:0 0 auto; }
  .bar-row{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:6px;
    min-height:36px;
  }
  h1{
    font-size:1.05rem;
    font-weight:800;
    margin:0;
    text-align:center;
    letter-spacing:.2px;
  }
  .settings-btn{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    min-height:0;
    padding:0;
    border-radius:50%;
    font-size:1.1rem;
    box-shadow:none;
  }
  .mode-row{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .mode-btn{
    font-size:.86rem;
    padding:8px 14px;
    border-radius:20px;
    background:transparent;
    box-shadow:none;
    color:var(--muted);
    border:1px solid var(--card-border);
    font-weight:600;
  }
  .mode-btn.active{
    background:var(--accent-2);
    color:#fff;
    border-color:var(--accent-2);
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.82rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .progress-bar{
    flex:1;
    height:5px;
    border-radius:4px;
    background:var(--card-border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent-2);
    width:0%;
    transition:width .2s ease;
  }
  .rank-badge{ white-space:nowrap; font-variant-numeric: tabular-nums; }

  /* ---- card area (scrolls internally if content is tall) ---- */
  .card-wrap{
    flex:1 1 auto;
    min-height:0;
    display:flex;
  }
  .card{
    flex:1;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:20px;
    box-shadow:var(--shadow);
    cursor:pointer;
    padding:22px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:14px;
    user-select:none;
    touch-action: pan-y;
    overflow-y:auto;
    transition: transform .08s ease;
  }
  .card:active{ transform: scale(0.99); }
  .word{
    font-size:clamp(2.2rem, 10vw, 2.9rem);
    font-weight:800;
    color:var(--accent);
    line-height:1.15;
  }
  .hint{ color:var(--muted); font-size:.92rem; }
  .swipe-hint{ color:var(--muted); font-size:.8rem; margin-top:2px; }
  .back{
    display:none;
    width:100%;
    flex-direction:column;
    gap:14px;
    text-align:left;
    margin:auto 0;
  }
  .back.show{ display:flex; }
  .front.hide{ display:none; }
  .meaning{
    text-align:center;
    font-size:1.5rem;
    font-weight:700;
    color:var(--text);
  }
  .examples{ display:flex; flex-direction:column; gap:10px; }
  .example{
    background:rgba(120,110,90,0.08);
    border-radius:12px;
    padding:10px 13px;
  }
  .example .it{ font-style:italic; color:var(--text); font-size:1.15rem; }
  .example .cz{ color:var(--muted); font-size:1.02rem; margin-top:3px; }
  .sentence-source{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    padding-top:2px;
    border-top:1px solid var(--card-border);
  }
  .word.is-sentence{
    font-size:clamp(1.35rem, 6.5vw, 1.9rem);
    font-style:italic;
    font-weight:700;
    color:var(--text);
    line-height:1.3;
  }

  /* ---- bottom controls (thumb reach) ---- */
  .controls{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    margin-top:10px;
    padding-top:2px;
  }
  button{
    border:none;
    border-radius:14px;
    font-size:1.02rem;
    font-weight:700;
    cursor:pointer;
    background:var(--card-bg);
    color:var(--text);
    border:1px solid var(--card-border);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    touch-action: manipulation;
    transition: transform .08s ease;
  }
  button:active{ transform: translateY(1px) scale(.98); }
  .controls button{
    flex:1;
    min-height:52px;
    padding:10px 6px;
  }
  .controls button.side{ flex:0 0 30%; font-size:.92rem; }
  button.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent-dark);
    flex:0 0 40%;
    font-size:1.08rem;
  }

  /* ---- settings overlay (holds the mode toggles, off by default) ---- */
  .settings-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,16,10,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px calc(var(--safe-r) + 20px) calc(var(--safe-b) + 20px) calc(var(--safe-l) + 20px);
    z-index:50;
  }
  .settings-overlay[hidden]{ display:none; }
  .settings-panel{
    background:var(--card-bg);
    border-radius:20px;
    padding:20px 18px;
    width:100%;
    max-width:420px;
    max-height:80vh;
    overflow-y:auto;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .settings-title{
    font-weight:800;
    font-size:1.05rem;
    text-align:center;
    margin:0 0 10px;
  }
  .settings-panel .mode-row:last-of-type{ margin-bottom:2px; }
  .close-settings{
    margin-top:14px;
    min-height:48px;
    background:var(--accent);
    color:#fff;
    border-color:var(--accent-dark);
  }

  /* ---- landscape: shorter chrome, bigger text ---- */
  @media (orientation: landscape){
    .app{ max-width:900px; padding-top: calc(var(--safe-t) + 5px); padding-bottom: calc(var(--safe-b) + 5px); }
    .bar-row{ min-height:28px; margin-bottom:4px; }
    h1{ font-size:.92rem; }
    .settings-btn{ width:30px; height:30px; font-size:.95rem; }
    .progress-row{ margin-bottom:4px; }
    .card{ padding:14px 34px; gap:10px; }
    .back{ margin:0; }
    .word{ font-size:clamp(2.2rem, 6.5vw, 3.6rem); }
    .word.is-sentence{ font-size:clamp(1.4rem, 4.2vw, 2.2rem); }
    .hint{ font-size:.92rem; }
    .swipe-hint{ font-size:.78rem; }
    .meaning{ font-size:1.7rem; }
    .example .it{ font-size:1.25rem; }
    .example .cz{ font-size:1.08rem; }
    .example{ padding:10px 14px; }
    .sentence-source{ font-size:.88rem; }
    .controls{ margin-top:6px; }
    .controls button{ min-height:42px; }
    .settings-panel{ max-height:90vh; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="bar-row">
      <h1>🇮🇹 Italská slovíčka</h1>
      <button class="settings-btn" id="settingsBtn" type="button" aria-label="Nastavení">⚙️</button>
    </div>
    <div class="progress-row">
      <span class="rank-badge" id="rankBadge">#1 / 2000</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="front" id="front">
        <div class="word" id="wordText"></div>
        <div class="hint" id="hintText">ťukni pro překlad a věty</div>
        <div class="swipe-hint">← swipe → pro další slovo</div>
      </div>
      <div class="back" id="back">
        <div class="meaning" id="meaningText"></div>
        <div class="examples" id="examplesBlock">
          <div class="example">
            <div class="it" id="s1"></div>
            <div class="cz" id="t1"></div>
          </div>
          <div class="example">
            <div class="it" id="s2"></div>
            <div class="cz" id="t2"></div>
          </div>
        </div>
        <div class="sentence-source" id="sentenceSource" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="side" id="prevBtn" type="button">←</button>
    <button class="primary" id="refreshBtn" type="button">🔄 Nové</button>
    <button class="side" id="nextBtn" type="button">→</button>
  </div>

</div>

<div class="settings-overlay" id="settingsOverlay" hidden>
  <div class="settings-panel">
    <div class="settings-title">Nastavení</div>
    <div class="mode-row">
      <button class="mode-btn active" id="typeWords" type="button">🔤 Slovíčka</button>
      <button class="mode-btn" id="typeSentences" type="button">💬 Věty</button>
    </div>
    <div class="mode-row" id="dirRow" style="display:none">
      <button class="mode-btn active" id="dirItCz" type="button">🇮🇹→🇨🇿 italsky nejdřív</button>
      <button class="mode-btn" id="dirCzIt" type="button">🇨🇿→🇮🇹 česky nejdřív</button>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="modeRandom" type="button">🔀 Náhodně</button>
      <button class="mode-btn" id="modeSeq" type="button">📖 Podle pořadí</button>
    </div>
    <button class="close-settings" id="closeSettings" type="button">Hotovo</button>
  </div>
</div>

ate.","t1":"V létě jezdíme na hory.","s2":"La montagna è alta.","t2":"Hora je vysoká."},{"r":399,"w":"il fiore","m":"květina","s1":"Compro dei fiori per mia madre.","t1":"Kupuji květiny pro svou matku.","s2":"Il fiore è rosso e bello.","t2":"Ta květina je krásná a červená."},{"r":400,"w":"la gioia","m":"radost","s1":"Sento una grande gioia.","t1":"Cítím velkou radost.","s2":"I bambini giocano con gioia.","t2":"Děti si hrají s radostí."},{"r":401,"w":"la felicità","m":"štěstí","s1":"La felicità è importante per tutti.","t1":"Štěstí je pro všechny důležité.","s2":"I bambini piangono di felicità.","t2":"Děti pláčou štěstím."},{"r":402,"w":"la tristezza","m":"smutek","s1":"Sento una grande tristezza oggi.","t1":"Dnes cítím velký smutek.","s2":"La tristezza passa con il tempo.","t2":"Smutek časem přejde."},{"r":403,"w":"la paura","m":"strach","s1":"Ho paura dei cani grandi.","t1":"Mám strach z velkých psů.","s2":"La paura non aiuta a decidere.","t2":"Strach nepomáhá při rozhodování."},{"r":404,"w":"la rabbia","m":"vztek","s1":"La rabbia non risolve i problemi.","t1":"Vztek problémy neřeší.","s2":"Ho sentito una rabbia improvvisa.","t2":"Pocítil jsem náhlý vztek."},{"r":405,"w":"l'amore","m":"láska","s1":"L'amore cambia la vita delle persone.","t1":"Láska mění život lidí.","s2":"Parlano sempre del loro amore.","t2":"Pořád mluví o své lásce."},{"r":406,"w":"l'odio","m":"nenávist","s1":"L'odio non porta niente di buono.","t1":"Nenávist nepřináší nic dobrého.","s2":"Nel film c'è molto odio tra i due.","t2":"Ve filmu je mezi oběma hodně nenávisti."},{"r":407,"w":"la speranza","m":"naděje","s1":"Abbiamo ancora speranza per il futuro.","t1":"Máme ještě naději do budoucna.","s2":"La speranza aiuta nei momenti difficili.","t2":"Naděje pomáhá v těžkých chvílích."},{"r":408,"w":"il dolore","m":"bolest","s1":"Sento dolore alla gamba destra.","t1":"Cítím bolest v pravé noze.","s2":"Il dolore passa dopo la medicina.","t2":"Bolest přejde po lécích."},{"r":409,"w":"il piacere","m":"potěšení","s1":"È un piacere conoscerti finalmente.","t1":"Je mi potěšením tě konečně poznat.","s2":"Leggere è un grande piacere per me.","t2":"Čtení je pro mě velké potěšení."},{"r":410,"w":"la sorpresa","m":"překvapení","s1":"Che bella sorpresa vederti qui!","t1":"To je krásné překvapení tě tu vidět!","s2":"Hanno preparato una sorpresa per lei.","t2":"Připravili pro ni překvapení."},{"r":411,"w":"la vergogna","m":"stud","s1":"Ha sentito vergogna davanti a tutti.","t1":"Cítil stud před všemi.","s2":"Non c'è vergogna a chiedere aiuto.","t2":"Není žádný stud si říct o pomoc."},{"r":412,"w":"la noia","m":"nuda","s1":"La noia arriva quando non fai niente.","t1":"Nuda přijde, když nic neděláš.","s2":"Guardo la televisione per la noia.","t2":"Dívám se na televizi z nudy."},{"r":413,"w":"l'ansia","m":"úzkost","s1":"L'esame gli causa molta ansia.","t1":"Zkouška mu působí velkou úzkost.","s2":"Sento ansia prima di ogni viaggio.","t2":"Před každou cestou cítím úzkost."},{"r":414,"w":"felice","m":"šťastný","s1":"Sono felice di vederti oggi.","t1":"Jsem šťastný, že tě dnes vidím.","s2":"I bambini sembrano molto felici.","t2":"Děti vypadají velmi šťastně."},{"r":415,"w":"triste","m":"smutný","s1":"Perché sei così triste oggi?","t1":"Proč jsi dnes tak smutný?","s2":"Il film aveva un finale triste.","t2":"Film měl smutný konec."},{"r":416,"w":"arrabbiato","m":"naštvaný","s1":"Il capo è arrabbiato con il collega.","t1":"Šéf je naštvaný na kolegu.","s2":"Perché sei arrabbiato con me?","t2":"Proč jsi na mě naštvaný?"},{"r":417,"w":"stanco","m":"unavený","s1":"Sono molto stanco dopo il lavoro.","t1":"Jsem po práci hodně unavený.","s2":"I bambini sono stanchi la sera.","t2":"Děti jsou večer unavené."},{"r":418,"w":"nervoso","m":"nervózní","s1":"È nervoso prima dell'esame importante.","t1":"Je nervózní před důležitou zkouškou.","s2":"Non essere nervoso, andrà tutto bene.","t2":"Nebuď nervózní, všechno dobře dopadne."},{"r":419,"w":"tranquillo","m":"klidný","s1":"Il mare oggi è molto tranquillo.","t1":"Moře je dnes velmi klidné.","s2":"Resta tranquillo, non c'è pericolo.","t2":"Zůstaň klidný, nehrozí žádné nebezpečí."},{"r":420,"w":"contento","m":"spokojený","s1":"Sono contento del mio nuovo lavoro.","t1":"Jsem spokojený se svou novou prací.","s2":"Il professore è contento degli studenti.","t2":"Profesor je se studenty spokojený."},{"r":421,"w":"curioso","m":"zvědavý","s1":"Il bambino è curioso di tutto.","t1":"Dítě je zvědavé na všechno.","s2":"Sono curioso di sapere la risposta.","t2":"Jsem zvědavý na odpověď."},{"r":422,"w":"geloso","m":"žárlivý","s1":"È geloso del suo fratello maggiore.","t1":"Žárlí na svého staršího bratra.","s2":"Non essere geloso dei miei amici.","t2":"Nebuď žárlivý na mé přátele."},{"r":423,"w":"orgoglioso","m":"hrdý","s1":"Sono orgoglioso di mia figlia.","t1":"Jsem hrdý na svou dceru.","s2":"Il padre è orgoglioso del figlio.","t2":"Otec je hrdý na syna."},{"r":424,"w":"gentile","m":"laskavý","s1":"Sei molto gentile con gli anziani.","t1":"Jsi velmi laskavý ke starším lidem.","s2":"Il maestro è gentile con gli alunni.","t2":"Učitel je laskavý ke svým žákům."},{"r":425,"w":"simpatico","m":"sympatický","s1":"Il tuo amico è davvero simpatico.","t1":"Tvůj přítel je opravdu sympatický.","s2":"Trovo simpatica la tua collega.","t2":"Připadá mi sympatická tvoje kolegyně."},{"r":426,"w":"antipatico","m":"nesympatický","s1":"Quel ragazzo è un po' antipatico.","t1":"Ten kluk je trochu nesympatický.","s2":"Non mi piace, è antipatico.","t2":"Nelíbí se mi, je nesympatický."},{"r":427,"w":"timido","m":"plachý","s1":"Il ragazzo è timido con le ragazze.","t1":"Ten kluk je plachý na dívky.","s2":"Da bambino ero molto timido.","t2":"Jako dítě jsem byl velmi plachý."},{"r":428,"w":"coraggioso","m":"odvážný","s1":"Devi essere coraggioso per cambiare lavoro.","t1":"Musíš být odvážný, abys změnil práci.","s2":"Il bambino è stato molto coraggioso.","t2":"Dítě bylo velmi odvážné."},{"r":429,"w":"pigro","m":"líný","s1":"Sono troppo pigro per uscire stasera.","t1":"Jsem dnes večer příliš líný jít ven.","s2":"Il gatto è pigro tutto il giorno.","t2":"Kočka je líná celý den."},{"r":430,"w":"intelligente","m":"inteligentní","s1":"La ragazza è molto intelligente.","t1":"Ta dívka je velmi inteligentní.","s2":"Il cane è un animale intelligente.","t2":"Pes je inteligentní zvíře."},{"r":431,"w":"stupido","m":"hloupý","s1":"Non fare domande stupide, per favore.","t1":"Neptej se prosím na hloupé otázky.","s2":"È stato uno sbaglio stupido.","t2":"Byla to hloupá chyba."},{"r":432,"w":"onesto","m":"čestný","s1":"È un uomo onesto e serio.","t1":"Je to čestný a vážný muž.","s2":"Preferisco un amico onesto.","t2":"Dávám přednost čestnému příteli."},{"r":433,"w":"bugiardo","m":"lživý","s1":"Non credo a un uomo bugiardo.","t1":"Nevěřím lživému muži.","s2":"È bugiardo, non dice mai la verità.","t2":"Je lhář, nikdy neříká pravdu."},{"r":434,"w":"generoso","m":"štědrý","s1":"Il nonno è sempre molto generoso.","t1":"Dědeček je vždy velmi štědrý.","s2":"È generoso con i suoi amici.","t2":"Je štědrý ke svým přátelům."},{"r":435,"w":"egoista","m":"sobecký","s1":"Non essere così egoista con noi.","t1":"Nebuď k nám tak sobecký.","s2":"Il collega è troppo egoista.","t2":"Kolega je příliš sobecký."},{"r":436,"w":"paziente","m":"trpělivý","s1":"Il maestro è molto paziente con gli alunni.","t1":"Učitel je velmi trpělivý se žáky.","s2":"Devi essere paziente con i bambini.","t2":"Musíš být trpělivý s dětmi."},{"r":437,"w":"impaziente","m":"netrpělivý","s1":"Sono impaziente di vedere il film.","t1":"Netrpělivě se těším na film.","s2":"I bambini sono impazienti prima del viaggio.","t2":"Děti jsou před cestou netrpělivé."},{"r":438,"w":"allegro","m":"veselý","s1":"La musica allegra mi mette di buon umore.","t1":"Veselá hudba mě naladí dobře.","s2":"Mio fratello è sempre allegro.","t2":"Můj bratr je vždy veselý."},{"r":439,"w":"serio","m":"vážný","s1":"Il professore ha un'aria molto seria.","t1":"Profesor vypadá velmi vážně.","s2":"Questo è un problem ":"Nelíčím se často."},{"r":473,"w":"riposarsi","m":"odpočívat","s1":"Dopo il lavoro mi piace riposarmi.","t1":"Po práci si rád odpočinu.","s2":"Si riposa un'ora ogni pomeriggio.","t2":"Každé odpoledne hodinu odpočívá."},{"r":474,"w":"sedersi","m":"posadit se","s1":"Ti prego, siediti qui vicino a me.","t1":"Prosím, posaď se sem vedle mě.","s2":"Si è seduto sulla sedia.","t2":"Posadil se na židli."},{"r":475,"w":"sdraiarsi","m":"lehnout si","s1":"Mi voglio sdraiare un po' sul letto.","t1":"Chci si trochu lehnout na postel.","s2":"Si sdraia sull'erba a leggere.","t2":"Lehne si na trávu a čte."},{"r":476,"w":"addormentarsi","m":"usnout","s1":"Mi addormento sempre tardi la sera.","t1":"Večer vždy usínám pozdě.","s2":"Si è addormentato durante il film.","t2":"Usnul během filmu."},{"r":477,"w":"svegliare","m":"probudit (někoho)","s1":"Il rumore mi sveglia ogni notte.","t1":"Ten hluk mě budí každou noc.","s2":"Non svegliare il bambino, per favore.","t2":"Nebuď prosím to dítě."},{"r":478,"w":"chiamare","m":"volat, jmenovat","s1":"Ti chiamo domani mattina presto.","t1":"Zítra ráno ti brzy zavolám.","s2":"Come chiamano questo animale?","t2":"Jak nazývají tohle zvíře?"},{"r":479,"w":"chiamarsi","m":"jmenovat se","s1":"Mi chiamo Marco, e tu?","t1":"Jmenuji se Marco, a ty?","s2":"Come si chiama tuo fratello?","t2":"Jak se jmenuje tvůj bratr?"},{"r":480,"w":"presentare","m":"představit","s1":"Ti voglio presentare mio fratello.","t1":"Chci ti představit svého bratra.","s2":"Ha presentato il nuovo progetto al capo.","t2":"Představil šéfovi nový projekt."},{"r":481,"w":"salutare","m":"pozdravit","s1":"Ho salutato tutti i miei colleghi.","t1":"Pozdravil jsem všechny své kolegy.","s2":"Mi saluta sempre con un sorriso.","t2":"Vždy mě pozdraví s úsměvem."},{"r":482,"w":"ringraziare","m":"poděkovat","s1":"Voglio ringraziare tutti gli amici.","t1":"Chci poděkovat všem přátelům.","s2":"Lo ringrazio per il regalo.","t2":"Děkuji mu za dárek."},{"r":483,"w":"scusarsi","m":"omluvit se","s1":"M re","m":"spotřebitel","s1":"Il consumatore sceglie il prodotto migliore.","t1":"Spotřebitel si vybírá nejlepší výrobek.","s2":"I consumatori pagano un prezzo alto.","t2":"Spotřebitelé platí vysokou cenu."},{"r":1203,"w":"la merce","m":"zboží","s1":"La merce arriva domani in negozio.","t1":"Zboží dorazí zítra do obchodu.","s2":"Il camion trasporta la merce in città.","t2":"Náklaďák převáží zboží do města."},{"r":1204,"w":"il trasporto","m":"doprava, přeprava","s1":"Il trasporto pubblico è molto comodo.","t1":"Veřejná doprava je velmi pohodlná.","s2":"Il trasporto della merce costa molto.","t2":"Přeprava zboží stojí hodně."},{"r":1205,"w":"il socio","m":"společník","s1":"Il mio socio lavora in ufficio.","t1":"Můj společník pracuje v kanceláři.","s2":"Ha trovato un nuovo socio per l'azienda.","t2":"Našel nového společníka pro firmu."},{"r":1206,"w":"il dirigente","m":"vedoucí pracovník, ředitel","s1":"Il dirigente decide il prezzo del prodotto.","t1":"Ředitel rozhoduje o ceně výrobku.","s2":"Il dirigente parla con i dipendenti.","t2":"Vedoucí mluví se zaměstnanci."},{"r":1207,"w":"il dipendente","m":"zaměstnanec","s1":"Il dipendente lavora otto ore al giorno.","t1":"Zaměstnanec pracuje osm hodin denně.","s2":"L'azienda ha cento dipendenti.","t2":"Firma má sto zaměstnanců."},{"r":1208,"w":"il guadagno","m":"výdělek, zisk","s1":"Il guadagno di quest'anno è alto.","t1":"Letošní zisk je vysoký.","s2":"Il suo guadagno dipende dalle vendite.","t2":"Jeho výdělek závisí na prodejích."},{"r":1209,"w":"il risparmio","m":"úspora","s1":"Il risparmio aiuta in caso di problemi.","t1":"Úspora pomáhá v případě problémů.","s2":"Metto i soldi nel conto di risparmio.","t2":"Dávám peníze na spořicí účet."},{"r":1210,"w":"la negoziazione","m":"vyjednávání","s1":"La negoziazione tra le due aziende continua.","t1":"Vyjednávání mezi oběma firmami pokračuje.","s2":"Dopo una lunga negoziazione hanno trovato un accordo.","t2":"Po dlouhém vyjednávání našli dohodu."},{"r":1211,"w":"l'accordo","m":"dohoda","s1":"Abbiamo firmato l'accordo insieme.","t1":"Podepsali jsme dohodu společně.","s2":"L'accordo tra i due paesi è importante.","t2":"Dohoda mezi oběma zeměmi je důležitá."},{"r":1212,"w":"saltare","m":"skákat, přeskočit","s1":"Il bambino salta sul letto.","t1":"Dítě skáče na posteli.","s2":"Il gatto salta sulla sedia.","t2":"Kočka skáče na židli."},{"r":1213,"w":"lanciare","m":"hodit, vrhnout","s1":"Lancia la palla al bambino.","t1":"Hoď míč dítěti.","s2":"Ha lanciato la scatola dalla finestra.","t2":"Hodil krabici z okna."},{"r":1214,"w":"spingere","m":"tlačit, strkat","s1":"Devo spingere la porta per aprirla.","t1":"Musím zatlačit na dveře, abych je otevřel.","s2":"Spinge la macchina verso il garage.","t2":"Tlačí auto směrem ke garáži."},{"r":1215,"w":"tirare","m":"táhnout","s1":"Il cane tira con tutta la forza.","t1":"Pes táhne vší silou.","s2":"Tira la corda verso di te.","t2":"Táhni provaz k sobě."},{"r":1216,"w":"piegare","m":"ohnout, složit","s1":"Piega il foglio a metà.","t1":"Přelož papír napůl.","s2":"Devo piegare i vestiti puliti.","t2":"Musím poskládat čisté oblečení."},{"r":1217,"w":"colpire","m":"udeřit, zasáhnout","s1":"La palla ha colpito la finestra.","t1":"Míč zasáhl okno.","s2":"Il fulmine ha colpito l'albero.","t2":"Blesk udeřil do stromu."},{"r":1218,"w":"afferrare","m":"chytit, uchopit","s1":"Ho afferrato la palla al volo.","t1":"Chytil jsem míč za letu.","s2":"Afferra la mano di tuo fratello.","t2":"Chyť ruku svého bratra."},{"r":1219,"w":"indicare","m":"ukázat, naznačit","s1":"Il segnale indica la strada giusta.","t1":"Značka ukazuje správnou cestu.","s2":"Il medico indica dove fa male.","t2":"Lékař ukazuje, kde to bolí."},{"r":1220,"w":"seguire","m":"následovat, sledovat","s1":"Segui la strada fino alla farmacia.","t1":"Následuj cestu až k lékárně.","s2":"Il cane mi segue ovunque vada.","t2":"Pes mě následuje, ať jdu kamkoli."},{"r":1221,"w":"evitare","m":"vyhnout se","s1":"Bisogna evitare gli errori gravi.","t1":"Je třeba vyhnout se vážným chybám.","s2":"Ho evitato di uscire con la pioggia.","t2":"Vyhnul jsem se vycházení v dešti."},{"r":1222,"w":"superare","m":"překonat, předjet","s1":"Ha superato l'esame difficile.","t1":"Zvládl těžkou zkoušku.","s2":"La macchina supera il camion lento.","t2":"Auto předjíždí pomalý náklaďák."},{"r":1223,"w":"raggiungere","m":"dosáhnout, dorazit","s1":"Vogliamo raggiungere l'accordo entro oggi.","t1":"Chceme dosáhnout dohody ještě dnes.","s2":"Abbiamo raggiunto la città di sera.","t2":"Do města jsme dorazili večer."},{"r":1224,"w":"attraversare","m":"přejít, přejet, překročit","s1":"I bambini attraversano la strada insieme.","t1":"Děti přecházejí ulici společně.","s2":"Attraversiamo il fiume con la barca.","t2":"Přeplouváme řeku lodí."},{"r":1225,"w":"scivolare","m":"klouzat, uklouznout","s1":"Ho scivolato sul ghiaccio ieri.","t1":"Včera jsem uklouzl na ledu.","s2":"Il bambino scivola sul pavimento bagnato.","t2":"Dítě klouže po mokré podlaze."},{"r":1226,"w":"inciampare","m":"zakopnout","s1":"È inciampato mentre correva in giardino.","t1":"Zakopl, když běžel po zahradě.","s2":"Ho inciampato sulla scatola in cucina.","t2":"Zakopl jsem o krabici v kuchyni."},{"r":1227,"w":"sollevare","m":"zvednout","s1":"Ha sollevato la scatola pesante.","t1":"Zvedl těžkou krabici.","s2":"Solleva il braccio per salutare.","t2":"Zvedá ruku na pozdrav."},{"r":1228,"w":"abbassare","m":"snížit, sklonit","s1":"Abbassa la voce, per favore.","t1":"Ztlum hlas, prosím.","s2":"Ha abbassato il prezzo del prodotto.","t2":"Snížil cenu výrobku."},{"r":1229,"w":"avvicinarsi","m":"přiblížit se","s1":"Il treno si avvicina alla stazione.","t1":"Vlak se blíží ke stanici.","s2":"Mi sono avvicinato alla porta piano.","t2":"Pomalu jsem se přiblížil ke dveřím."},{"r":1230,"w":"allontanarsi","m":"vzdálit se","s1":"La macchina si allontana lentamente.","t1":"Auto se pomalu vzdaluje.","s2":"Si è allontanato dalla sua famiglia.","t2":"Vzdálil se od své rodiny."},{"r":1231,"w":"voltare","m":"otočit, zabočit","s1":"Volta a destra al semaforo.","t1":"Zabočte doprava na semaforu.","s2":"Ha voltato la testa verso di me.","t2":"Otočil hlavu ke mně."},{"r":1232,"w":"strisciare","m":"plazit se","s1":"Il serpente striscia sull'erba.","t1":"Had se plazí po trávě.","s2":"Il bambino striscia sul pavimento.","t2":"Dítě se plazí po podlaze."},{"r":1233,"w":"arrampicarsi","m":"šplhat, lézt","s1":"I bambini si arrampicano sull'albero.","t1":"Děti šplhají na strom.","s2":"Si è arrampicato sulla montagna da solo.","t2":"Vylezl na horu sám."},{"r":1234,"w":"trascinare","m":"táhnout, vléct","s1":"Ha trascinato la scatola fino alla porta.","t1":"Dovlekl krabici až ke dveřím.","s2":"Il vento trascina le foglie per strada.","t2":"Vítr žene listí po ulici."},{"r":1235,"w":"spostare","m":"přesunout, posunout","s1":"Devo spostare il tavolo in cucina.","t1":"Musím přesunout stůl do kuchyně.","s2":"Hanno spostato la riunione a domani.","t2":"Přeložili schůzku na zítřek."},{"r":1236,"w":"gettare","m":"hodit, odhodit","s1":"Ha gettato la carta nel cestino.","t1":"Hodil papír do koše.","s2":"Gettano i rifiuti fuori dalla casa.","t2":"Vyhazují odpadky ven z domu."},{"r":1237,"w":"buttare","m":"hodit, vyhodit","s1":"Butta via questa scatola vecchia.","t1":"Vyhoď tuhle starou krabici.","s2":"Ho buttato i vestiti rotti.","t2":"Vyhodil jsem roztrhané oblečení."},{"r":1238,"w":"appoggiare","m":"opřít, položit","s1":"Appoggia il libro sul tavolo.","t1":"Polož knihu na stůl.","s2":"Si è appoggiato al muro stanco.","t2":"Unaveně se opřel o zeď."},{"r":1239,"w":"legare","m":"svázat, uvázat","s1":"Lega il cane con la corda.","t1":"Přivaž psa na provaz.","s2":"Ha legato i capelli con un nastro.","t2":"Svázala si vlasy stuhou."},{"r":1240,"w":"sciogliere","m":"rozvázat, rozpustit","s1":"Il sole scioglie la neve in montagna.","t1":"Slunce roztává sníh v horách.","s2":"Devo sciogliere lo zucchero nell'acqua calda.","t2":"Musím rozpustit cukr v horké vodě."},{"r":1241,"w":"premere","m":"stisknout, zmáčknout","s1":"Premi il bottone per iniziare.","t1":"Stiskni tlačítko a začni.","s2":"Ha premuto il pulsante dell'ascensore.","t2":"Stiskl tlačítko výtahu."},{"r":1242,"w":"versare","m":"nalít, vysypat","s1":"Versa l'acqua nel bicchiere.","t1":"Nalij vodu do sklenice.","s2":"Ha versato il vino sulla tavola.","t2":"Rozlil víno na stůl."},{"r":1243,"w":"mescolare","m":"míchat, promíchat","s1":"Mescola lo zucchero con l'acqua calda.","t1":"Zamíchej cukr do horké vody.","s2":"Ho mescolato il caffè con lo zucchero.","t2":"Zamíchal jsem cukr do kávy."},{"r":1244,"w":"riempire","m":"naplnit","s1":"Riempi il bicchiere d'acqua.","t1":"Naplň sklenici vodou.","s2":"Ha riempito la scatola di libri.","t2":"Naplnil krabici knihami."},{"r":1245,"w":"svuotare","m":"vyprázdnit","s1":"Devo svuotare la valigia.","t1":"Musím vyprázdnit kufr.","s2":"Ha svuotato il bicchiere in un sorso.","t2":"Vyprázdnil sklenici na jeden zátah."},{"r":1246,"w":"schiacciare","m":"rozmáčknout, zmáčknout","s1":"Ho schiacciato un dito nella porta.","t1":"Přiskřípl jsem si prst do dveří.","s2":"Schiaccia il pomodoro con la forchetta.","t2":"Rozmáčkni rajče vidličkou."},{"r":1247,"w":"il salto","m":"skok","s1":"Il salto del cavallo è molto alto.","t1":"Skok koně je velmi vysoký.","s2":"Ha fatto un grande salto nel fiume.","t2":"Udělal velký skok do řeky."},{"r":1248,"w":"il colpo","m":"úder, rána","s1":"Ha sentito un colpo alla porta.","t1":"Uslyšel ránu na dveře.","s2":"Un colpo di vento ha chiuso la finestra.","t2":"Náraz větru zavřel okno."},{"r":1249,"w":"la spinta","m":"postrčení, tlak","s1":"Ha dato una spinta alla porta.","t1":"Postrčil dveře.","s2":"La spinta del vento era molto forte.","t2":"Tlak větru byl velmi silný."},{"r":1250,"w":"il passo","m":"krok","s1":"Fai un passo avanti.","t1":"Udělej krok vpřed.","s2":"Cammina con passo lento.","t2":"Chodí pomalým krokem."},{"r":1251,"w":"la caduta","m":"pád","s1":"Ha avuto una brutta caduta in bicicletta.","t1":"Měl ošklivý pád na kole.","s2":"La caduta dei prezzi ha aiutato i consumatori.","t2":"Pokles cen pomohl spotřebitelům."},{"r":1252,"w":"immaginare","m":"představit si","s1":"Non riesco a immaginare la sua reazione.","t1":"Nedokážu si představit jeho reakci.","s2":"Immagina di vivere in un'altra città.","t2":"Představ si, že žiješ v jiném městě."},{"r":1253,"w":"indovinare","m":"uhodnout","s1":"Prova a indovinare il mio nome.","t1":"Zkus uhodnout mé jméno.","s2":"Ha indovinato la risposta giusta.","t2":"Uhodl správnou odpověď."},{"r":1254,"w":"notare","m":"všimnout si","s1":"Ho notato un errore nel testo.","t1":"Všiml jsem si chyby v textu.","s2":"Non ha notato il cambiamento.","t2":"Nevšiml si té změny."},{"r":1255,"w":"osservare","m":"pozorovat","s1":"Il medico osserva il paziente con attenzione.","t1":"Lékař pozorně pozoruje pacienta.","s2":"Osserviamo gli animali dalla finestra.","t2":"Pozorujeme zvířata z okna."},{"r":1256,"w":"riconoscere","m":"poznat, uznat","s1":"Ho riconosciuto il suo volto subito.","t1":"Hned jsem poznal jeho tvář.","s2":"Il capo riconosce il suo errore.","t2":"Šéf uznává svou chybu."},{"r":1257,"w":"confondere","m":"splést, zaměnit","s1":"Spesso confondo i due fratelli.","t1":"Často si pletu ty dva bratry.","s2":"Ha confuso il nome del prodotto.","t2":"Spletl si název výrobku."},{"r":1258,"w":"paragonare","m":"srovnat","s1":"Non paragonare i due figli.","t1":"Nesrovnávej ty dva syny.","s2":"Paragoniamo i prezzi dei due negozi.","t2":"Porovnáváme ceny dvou obchodů."},{"r":1259,"w":"valutare","m":"ohodnotit, posoudit","s1":"Il dirigente valuta il lavoro dei dipendenti.","t1":"Ředitel hodnotí práci zaměstnanců.","s2":"Dobbiamo valutare il rischio prima di decidere.","t2":"Musíme posoudit riziko, než se rozhodneme."},{"r":1260,"w":"giudicare","m":"soudit, posuzovat","s1":"Non giudicare senza conoscere i fatti.","t1":"Nesuď, aniž bys znal fakta.","s2":"La gente lo giudica troppo severamente.","t2":"Lidé ho soudí příliš přísně."},{"r":1261,"w":"consigliare","m":"poradit","s1":"Il medico mi consiglia di dormire di più.","t1":"Lékař mi radí víc spát.","s2":"Ti consiglio di leggere questo libro.","t2":"Doporučuji ti přečíst tuhle knihu."},{"r":1262,"w":"avvertire","m":"upozornit, varovat","s1":"Ti avverto, la strada è pericolosa.","t1":"Varuji tě, ta cesta je nebezpečná.","s2":"Il capo ha avvertito i dipendenti del rischio.","t2":"Šéf upozornil zaměstnance na riziko."},{"r":1263,"w":"informare","m":"informovat","s1":"Devo informare la famiglia della decisione.","t1":"Musím informovat rodinu o rozhodnutí.","s2":"Il giornale informa i cittadini ogni giorno.","t2":"Noviny informují občany každý den."},{"r":1264,"w":"comunicare","m":"komunikovat, sdělit","s1":"I due paesi comunicano bene tra loro.","t1":"Obě země spolu dobře komunikují.","s2":"Comunico con i colleghi via telefono.","t2":"Komunikuji s kolegy po telefonu."},{"r":1265,"w":"esprimere","m":"vyjádřit","s1":"Vuole esprimere la sua opinione.","t1":"Chce vyjádřit svůj názor.","s2":"Non riesce a esprimere i suoi sentimenti.","t2":"Nedokáže vyjádřit své city."},{"r":1266,"w":"descrivere","m":"popsat","s1":"Descrivi la tua casa in poche parole.","t1":"Popiš svůj dům v pár slovech.","s2":"Il testimone ha descritto l'uomo alla polizia.","t2":"Svědek popsal muže policii."},{"r":1267,"w":"definire","m":"definovat, vymezit","s1":"È difficile definire questo problema.","t1":"Je těžké tento problém definovat.","s2":"Il contratto definisce i diritti del dipendente.","t2":"Smlouva vymezuje práva zaměstnance."},{"r":1268,"w":"sottolineare","m":"zdůraznit","s1":"Voglio sottolineare l'importanza del tempo.","t1":"Chci zdůraznit důležitost času.","s2":"Il professore sottolinea le parole difficili.","t2":"Profesor zdůrazňuje obtížná slova."},{"r":1269,"w":"dimostrare","m":"dokázat, předvést","s1":"I fatti dimostrano che ha ragione.","t1":"Fakta dokazují, že má pravdu.","s2":"Ha dimostrato molto coraggio.","t2":"Prokázal velkou odvahu."},{"r":1270,"w":"convincere","m":"přesvědčit","s1":"Non riesco a convincerlo a venire "s1":"La polizia sospetta di lui.","t1":"Policie ho podezřívá.","s2":"Sospetto che ci sia un problema.","t2":"Tuším, že je nějaký problém."},{"r":1281,"w":"meravigliarsi","m":"divit se, žasnout","s1":"Mi sono meravigliato del suo talento.","t1":"Žasl jsem nad jeho talentem.","s2":"Non c'è da meravigliarsi, è molto bravo.","t2":"Není se čemu divit, je velmi šikovný."},{"r":1282,"w":"lamentarsi","m":"stěžovat si","s1":"Si lamenta sempre del lavoro.","t1":"Pořád si stěžuje na práci.","s2":"Non lamentarti del tempo, per favore.","t2":"Nestěžuj si na počasí, prosím."},{"r":1283,"w":"vantarsi","m":"chlubit se","s1":"Si vanta sempre dei suoi successi.","t1":"Vždy se chlubí svými úspěchy.","s2":"Non mi piace vantarmi con gli amici.","t2":"Nerad se chlubím před přáteli."},{"r":1284,"w":"fingere","m":"předstírat","s1":"Finge di non capire niente.","t1":"Předstírá, že ničemu nerozumí.","s2":"Ha finto di essere malato.","t2":"Předstíral, že je nemocný."},{"r":1285,"w":"mentire","m":"lhát","s1":"Non devi mentire ai tuoi genitori.","t1":"Nesmíš lhát svým rodičům.","s2":"Ha mentito sul suo lavoro.","t2":"Lhal ohledně své práce."},{"r":1286,"w":"la comunicazione","m":"komunikace","s1":"La comunicazione tra i colleghi è importante.","t1":"Komunikace mezi kolegy je důležitá.","s2":"Abbiamo perso la comunicazione con lui.","t2":"Ztratili jsme s ním spojení."},{"r":1287,"w":"il discorso","m":"řeč, proslov","s1":"Il dirigente ha fatto un lungo discorso.","t1":"Ředitel měl dlouhý proslov.","s2":"Il discorso del presidente è stato interessante.","t2":"Prezidentův projev byl zajímavý."},{"r":1288,"w":"la conversazione","m":"konverzace, rozhovor","s1":"Abbiamo avuto una bella conversazione.","t1":"Měli jsme příjemný rozhovor.","s2":"La conversazione è durata due ore.","t2":"Konverzace trvala dvě hodiny."},{"r":1289,"w":"il dialogo","m":"dialog","s1":"Il dialogo tra i due paesi continua.","t1":"Dialog mezi oběma zeměmi pokračuje.","s2":"Preferisco il dialogo alla lite.","t2":"Dávám přednost dialogu před hádkou."},{"r":1290,"w":"l'opinione","m":"názor","s1":"Rispetto la tua opinione.","t1":"Respektuji tvůj názor.","s2":"Ognuno ha la propria opinione.","t2":"Každý má svůj vlastní názor."},{"r":1291,"w":"l'argomento","m":"téma, argument","s1":"Questo è un argomento difficile.","t1":"Tohle je obtížné téma.","s2":"Ha usato un buon argomento nella discussione.","t2":"Použil dobrý argument v diskuzi."},{"r":1292,"w":"il dettaglio","m":"detail","s1":"Mi racconti tutti i dettagli?","t1":"Povíš mi všechny detaily?","s2":"Ha notato ogni dettaglio della stanza.","t2":"Všiml si každého detailu v místnosti."},{"r":1293,"w":"il vantaggio","m":"výhoda","s1":"Lavorare da casa ha molti vantaggi.","t1":"Práce z domova má mnoho výhod.","s2":"Il prezzo basso è un grande vantaggio.","t2":"Nízká cena je velká výhoda."},{"r":1294,"w":"lo svantaggio","m":"nevýhoda","s1":"Il freddo è lo svantaggio di questa città.","t1":"Zima je nevýhodou tohoto města.","s2":"Ogni scelta ha vantaggi e svantaggi.","t2":"Každá volba má výhody a nevýhody."},{"r":1295,"w":"il rischio","m":"riziko","s1":"Non voglio correre questo rischio.","t1":"Nechci riskovat.","s2":"Il rischio di malattia aumenta con l'età.","t2":"Riziko nemoci roste s věkem."},{"r":1296,"w":"la responsabilità","m":"zodpovědnost","s1":"Il dirigente ha molta responsabilità.","t1":"Ředitel má velkou zodpovědnost.","s2":"È tua responsabilità finire il lavoro.","t2":"Je tvoje zodpovědnost práci dokončit."},{"r":1297,"w":"l'errore","m":"chyba","s1":"Ho trovato un errore nel testo.","t1":"Našel jsem chybu v textu.","s2":"Tutti possono fare un errore.","t2":"Každý může udělat chybu."},{"r":1298,"w":"lo sbaglio","m":"omyl, chyba","s1":"È stato solo uno sbaglio.","t1":"Byl to jen omyl.","s2":"Ha capito il suo sbaglio subito.","t2":"Hned pochopil svůj omyl."},{"r":1299,"w":"la scelta","m":"výběr, volba","s1":"Hai fatto la scelta giusta.","t1":"Udělal jsi správnou volbu.","s2":"La scelta non è affatto facile.","t2":"Volba vůbec není lehká."},{"r":1300,"w":"la decisione","m":"rozhodnutí","s1":"Devo prendere una decisione importante.","t1":"Musím udělat důležité rozhodnutí.","s2":"La decisione finale spetta a te.","t2":"Konečné rozhodnutí je na tobě."},{"r":1301,"w":"il dubbio","m":"pochybnost","s1":"Ho ancora qualche dubbio.","t1":"Mám ještě nějaké pochybnosti.","s2":"Non c'è dubbio che abbia ragione.","t2":"Není pochyb, že má pravdu."},{"r":1302,"w":"la certezza","m":"jistota","s1":"Parla sempre con grande certezza.","t1":"Mluví vždy s velkou jistotou.","s2":"Non ho la certezza che sia vero.","t2":"Nemám jistotu, že je to pravda."},{"r":1303,"w":"il consiglio","m":"rada","s1":"Grazie per il tuo consiglio.","t1":"Děkuji za tvou radu.","s2":"Il medico mi ha dato un buon consiglio.","t2":"Lékař mi dal dobrou radu."},{"r":1304,"w":"l'avviso","m":"upozornění, oznámení","s1":"Ho letto l'avviso sulla porta.","t1":"Přečetl jsem si oznámení na dveřích.","s2":"L'avviso dice che il negozio è chiuso.","t2":"Upozornění říká, že obchod je zavřený."},{"r":1305,"w":"la malattia","m":"nemoc","s1":"La malattia lo ha tenuto a letto.","t1":"Nemoc ho udržela na lůžku.","s2":"Questa malattia è molto comune.","t2":"Tato nemoc je velmi běžná."},{"r":1306,"w":"il farmaco","m":"lék","s1":"Il medico mi ha dato un farmaco nuovo.","t1":"Lékař mi dal nový lék.","s2":"Devo prendere il farmaco due volte al giorno.","t2":"Musím brát lék dvakrát denně."},{"r":1307,"w":"la febbre","m":"horečka","s1":"Ha la febbre alta stasera.","t1":"Dnes večer má vysokou horečku.","s2":"La febbre è scesa dopo il farmaco.","t2":"Horečka po léku klesla."},{"r":1308,"w":"la tosse","m":"kašel","s1":"Ho la tosse da tre giorni.","t1":"Mám kašel už tři dny.","s2":"La tosse non lo lascia dormire.","t2":"Kašel mu nedovolí spát."},{"r":1309,"w":"la farmacia","m":"lékárna","s1":"Vado in farmacia a comprare il farmaco.","t1":"Jdu do lékárny koupit lék.","s2":"La farmacia è aperta fino a tardi.","t2":"Lékárna je otevřená do pozdních hodin."},{"r":1310,"w":"la pillola","m":"pilulka, tableta","s1":"Prendi questa pillola dopo i pasti.","t1":"Vezmi si tuhle tabletu po jídle.","s2":"Ha dimenticato di prendere la pillola.","t2":"Zapomněl si vzít pilulku."},{"r":1311,"w":"l'iniezione","m":"injekce","s1":"Il medico mi ha fatto un'iniezione.","t1":"Lékař mi dal injekci.","s2":"Ha molta paura delle iniezioni.","t2":"Má velký strach z injekcí."},{"r":1312,"w":"la ferita","m":"rána, zranění","s1":"La ferita al braccio è profonda.","t1":"Rána na paži je hluboká.","s2":"Ha pulito la ferita con attenzione.","t2":"Pečlivě vyčistil ránu."},{"r":1313,"w":"la cicatrice","m":"jizva","s1":"Ha una cicatrice sulla mano.","t1":"Má jizvu na ruce.","s2":"La cicatrice è quasi scomparsa.","t2":"Jizva už téměř zmizela."},{"r":1314,"w":"la salute","m":"zdraví","s1":"La salute è più importante del denaro.","t1":"Zdraví je důležitější než peníze.","s2":"Fa molto sport per la sua salute.","t2":"Kvůli zdraví sportuje hodně."},{"r":1315,"w":"la dieta","m":"dieta","s1":"Sono a dieta da un mese.","t1":"Držím dietu už měsíc.","s2":"La dieta aiuta a stare in salute.","t2":"Dieta pomáhá udržet zdraví."},{"r":1316,"w":"respirare","m":"dýchat","s1":"Non riesco a respirare bene stasera.","t1":"Dnes večer nemůžu pořádně dýchat.","s2":"Deve respirare lentamente dopo la corsa.","t2":"Po běhu musí dýchat pomalu."},{"r":1317,"w":"guarire","m":"uzdravit se, vyléčit","s1":"Spero che tu guarisca presto.","t1":"Doufám, že se brzy uzdravíš.","s2":"È guarito dalla malattia in una settimana.","t2":"Z nemoci se uzdravil za týden."},{"r":1318,"w":"ammalarsi","m":"onemocnět","s1":"Si è ammalato durante il viaggio.","t1":"Onemocněl během cesty.","s2":"Non voglio ammalarmi prima delle vacanze.","t2":"Nechci onemocnět před dovolenou."},{"r":1319,"w":"curare","m":"léčit, starat se o","s1":"Il medico cura molti pazienti.","t1":"Lékař léčí mnoho pacientů.","s2":"Devi curare bene questa ferita.","t2":"Musíš tuhle ránu dobře ošetřovat."},{"r":1320,"w":"il raffreddore","m":"nachlazení","s1":"Ho preso un raffreddore forte.","t1":"Chytil jsem silné nachlazení.","s2":"Il raffreddore passa in pochi giorni.","t2":"Nachlazení přejde za pár dní."},{"r":1321,"w":"l'influenza","m":"chřipka","s1":"L'influenza mi ha tenuto a letto.","t1":"Chřipka mě udržela na lůžku.","s2":"Ogni inverno arriva l'influenza.","t2":"Každou zimu přichází chřipka."},{"r":1322,"w":"l'allergia","m":"alergie","s1":"Ha un'allergia ai gatti.","t1":"Má alergii na kočky.","s2":"La mia allergia peggiora in primavera.","t2":"Moje alergie se na jaře zhoršuje."},{"r":1323,"w":"il sintomo","m":"příznak","s1":"La tosse è un sintomo del raffreddore.","t1":"Kašel je příznakem nachlazení.","s2":"Il medico chiede quali sintomi hai.","t2":"Lékař se ptá, jaké máš příznaky."},{"r":1324,"w":"la diagnosi","m":"diagnóza","s1":"Il medico ha fatto la diagnosi.","t1":"Lékař stanovil diagnózu.","s2":"La diagnosi ha richiesto molti esami.","t2":"Diagnóza vyžadovala mnoho vyšetření."},{"r":1325,"w":"l'operazione","m":"operace","s1":"L'operazione è durata tre ore.","t1":"Operace trvala tři hodiny.","s2":"Dopo l'operazione deve stare a letto.","t2":"Po operaci musí ležet v posteli."},{"r":1326,"w":"il chirurgo","m":"chirurg","s1":"Il chirurgo ha operato con successo.","t1":"Chirurg operoval úspěšně.","s2":"Il chirurgo lavora in questo ospedale.","t2":"Chirurg pracuje v této nemocnici."},{"r":1327,"w":"la vaccinazione","m":"očkování","s1":"La vaccinazione protegge dalla malattia.","t1":"Očkování chrání před nemocí.","s2":"Ho fatto la vaccinazione la settimana scorsa.","t2":"Minulý týden jsem se nechal očkovat."},{"r":1328,"w":"il cerotto","m":"náplast","s1":"Ho messo un cerotto sul dito.","t1":"Dal jsem si náplast na prst.","s2":"Serve un cerotto per questa ferita.","t2":"Na tuhle ránu je potřeba náplast."},{"r":1329,"w":"la benda","m":"obvaz","s1":"L'infermiere ha messo una benda sul braccio.","t1":"Zdravotní sestra dala obvaz na paži.","s2":"Devi cambiare la benda ogni giorno.","t2":"Musíš každý den měnit obvaz." in macchina bianca.","t1":"Nevěsta přijíždí bílým autem.","s2":"La sposa è bellissima oggi.","t2":"Nevěsta je dnes moc krásná."},{"r":1651,"w":"il fidanzato","m":"snoubenec, přítel","s1":"Il mio fidanzato lavora in banca.","t1":"Můj přítel pracuje v bance.","s2":"Presento il mio fidanzato ai genitori.","t2":"Představuji svého přítele rodičům."},{"r":1652,"w":"la fidanzata","m":"snoubenka, přítelkyně","s1":"La sua fidanzata studia medicina.","t1":"Jeho přítelkyně studuje medicínu.","s2":"Esco con la mia fidanzata stasera.","t2":"Dnes večer jdu ven se svou přítelkyní."},{"r":1653,"w":"l'anniversario","m":"výročí","s1":"Festeggiamo il nostro anniversario di matrimonio.","t1":"Slavíme naše výročí svatby.","s2":"L'anniversario cade a giugno.","t2":"Výročí připadá na červen."},{"r":1654,"w":"il funerale","m":"pohřeb","s1":"Il funerale si svolge domani.","t1":"Pohřeb se koná zítra.","s2":"Tutta la famiglia va al funerale.","t2":"Celá rodina jde na pohřeb."},{"r":1655,"w":"il battesimo","m":"křest","s1":"Il battesimo del bambino è domenica.","t1":"Křest dítěte je v neděli.","s2":"Invitiamo tutti al battesimo.","t2":"Zveme všechny na křest."},{"r":1656,"w":"la comunione","m":"svaté přijímání","s1":"La comunione è una festa importante.","t1":"Svaté přijímání je důležitá slavnost.","s2":"Mia figlia fa la prima comunione.","t2":"Moje dcera má první přijímání."},{"r":1657,"w":"il carnevale","m":"karneval","s1":"Al carnevale i bambini si divertono molto.","t1":"Na karnevalu se děti moc baví.","s2":"Il carnevale di Venezia è famoso.","t2":"Benátský karneval je slavný."},{"r":1658,"w":"la maschera","m":"maska","s1":"Indosso una maschera colorata.","t1":"Mám na sobě barevnou masku.","s2":"La maschera nasconde il viso.","t2":"Maska zakrývá obličej."},{"r":1659,"w":"il palloncino","m":"balónek","s1":"I bambini giocano con i palloncini.","t1":"Děti si hrají s balónky.","s2":"Attacco i palloncini alla porta.","t2":"Přivazuji balónky ke dveřím."},{"r":1660,"w":"la decorazione","m":"výzdo ":"styl","s1":"Il suo stile di scrittura è semplice.","t1":"Jeho styl psaní je jednoduchý.","s2":"Mi piace lo stile di questo vestito.","t2":"Líbí se mi styl těchto šatů."},{"r":1671,"w":"la moda","m":"móda","s1":"Segue sempre l'ultima moda.","t1":"Vždy sleduje poslední módu.","s2":"La moda italiana è famosa nel mondo.","t2":"Italská móda je slavná po celém světě."},{"r":1672,"w":"il pistacchio","m":"pistácie","s1":"Il gelato al pistacchio è il mio preferito.","t1":"Pistáciová zmrzlina je moje oblíbená.","s2":"Compro una busta di pistacchi.","t2":"Kupuji sáček pistácií."},{"r":1673,"w":"la castagna","m":"kaštan","s1":"In autunno raccogliamo le castagne.","t1":"Na podzim sbíráme kaštany.","s2":"Mangiamo castagne calde d'inverno.","t2":"V zimě jíme teplé kaštany."},{"r":1674,"w":"il fico","m":"fík","s1":"L'albero di fico cresce in giardino.","t1":"Fíkovník roste na zahradě.","s2":"I fichi maturi sono molto dolci.","t2":"Zralé fíky jsou velmi sladké."},{"r":1675,"w":"il kiwi","m":"kiwi","s1":"Il kiwi contiene molta vitamina C.","t1":"Kiwi obsahuje hodně vitamínu C.","s2":"Taglio il kiwi a fette.","t2":"Krájím kiwi na plátky."},{"r":1676,"w":"la crema","m":"krém","s1":"La torta ha uno strato di crema.","t1":"Dort má vrstvu krému.","s2":"Metto la crema sul dolce.","t2":"Dávám krém na zákusek."},{"r":1677,"w":"il budino","m":"pudink","s1":"Preparo un budino al cioccolato.","t1":"Připravuji čokoládový pudink.","s2":"Il budino si mangia freddo.","t2":"Pudink se jí studený."},{"r":1678,"w":"la panna","m":"smetana","s1":"Aggiungo la panna al caffè.","t1":"Přidávám smetanu do kávy.","s2":"La torta è decorata con panna montata.","t2":"Dort je ozdobený šlehačkou."},{"r":1679,"w":"l'ospitalità","m":"pohostinnost","s1":"Ringrazio la famiglia per l'ospitalità.","t1":"Děkuji rodině za pohostinnost.","s2":"L'ospitalità italiana è famosa.","t2":"Italská pohostinnost je slavná."},{"r":1680,"w":"il rinfresco","m":"občerstvení","s1":"Dopo la cerimonia c'è un rinfresco.","t1":"Po obřadu j 1":"Voda se už skoro vaří.","s2":"Metti la pasta quando l'acqua bolle.","t2":"Dej těstoviny, až se voda vaří."},{"r":1842,"w":"affettare","m":"krájet na plátky","s1":"Puoi affettare il pane, per favore?","t1":"Můžeš nakrájet chleba na plátky, prosím?","s2":"Ha affettato il formaggio sottile.","t2":"Nakrájel sýr na tenké plátky."},{"r":1843,"w":"sbucciare","m":"loupat","s1":"Devo sbucciare le patate per la cena.","t1":"Musím oloupat brambory na večeři.","s2":"Mio figlio sbuccia la mela da solo.","t2":"Můj syn si loupe jablko sám."},{"r":1844,"w":"assaggiare","m":"ochutnat","s1":"Vuoi assaggiare questo dolce?","t1":"Chceš ochutnat tenhle dezert?","s2":"Ho assaggiato un piatto nuovo al ristorante.","t2":"Ochutnal jsem v restauraci nové jídlo."},{"r":1845,"w":"masticare","m":"žvýkat","s1":"Bisogna masticare bene il cibo.","t1":"Je třeba jídlo dobře žvýkat.","s2":"Il cane mastica il suo giocattolo.","t2":"Pes žvýká svou hračku."},{"r":1846,"w":"digerire","m":"trávit","s1":"Non riesco a digerire il latte.","t1":"Nesnáším mléko, špatně ho trávím.","s2":"Ho mangiato troppo e faccio fatica a digerire.","t2":"Snědl jsem moc a teď špatně trávím."},{"r":1847,"w":"russare","m":"chrápat","s1":"Mio padre russa quando dorme.","t1":"Můj táta chrápe, když spí.","s2":"Non sapevo di russare così forte.","t2":"Nevěděl jsem, že tak hlasitě chrápu."},{"r":1848,"w":"sbadigliare","m":"zívat","s1":"Continuo a sbadigliare, sono stanco.","t1":"Pořád zívám, jsem unavený.","s2":"La bambina sbadiglia prima di dormire.","t2":"Holčička zívá, než jde spát."},{"r":1849,"w":"stirare","m":"žehlit","s1":"Devo stirare le camicie per domani.","t1":"Musím vyžehlit košile na zítra.","s2":"Non mi piace stirare i vestiti.","t2":"Nerad žehlím oblečení."},{"r":1850,"w":"appendere","m":"pověsit","s1":"Ho appeso il quadro in salotto.","t1":"Pověsil jsem obraz do obýváku.","s2":"Puoi appendere la giacca qui?","t2":"Můžeš tady pověsit bundu?"},{"r":1851,"w":"caricare","m":"nabít, naložit","s1":"Devo caricare il telefono stanotte.","t1":"Musím dnes v noci nabít telefon.","s2":"Hanno caricato le valigie in macchina.","t2":"Naložili kufry do auta."},{"r":1852,"w":"scaricare","m":"stáhnout, vybít","s1":"Ho scaricato un'applicazione nuova.","t1":"Stáhl jsem si novou aplikaci.","s2":"La batteria del telefono si è scaricata.","t2":"Baterie telefonu se vybila."},{"r":1853,"w":"stampare","m":"tisknout","s1":"Posso stampare questo documento qui?","t1":"Můžu si tady vytisknout tento dokument?","s2":"La stampante non riesce a stampare le foto.","t2":"Tiskárna nedokáže vytisknout fotky."},{"r":1854,"w":"cliccare","m":"kliknout","s1":"Clicca sul pulsante verde per continuare.","t1":"Klikni na zelené tlačítko pro pokračování.","s2":"Ho cliccato sul link sbagliato.","t2":"Kliknul jsem na špatný odkaz."},{"r":1855,"w":"spedire","m":"odeslat, poslat","s1":"Devo spedire questo pacco oggi.","t1":"Musím dnes odeslat tenhle balík.","s2":"Ti spedisco l'email domani mattina.","t2":"Pošlu ti email zítra ráno."},{"r":1856,"w":"colorare","m":"vybarvit","s1":"Il bambino colora il disegno con le matite.","t1":"Dítě vybarvuje obrázek pastelkami.","s2":"Abbiamo colorato le uova per Pasqua.","t2":"Vybarvili jsme vajíčka na Velikonoce."},{"r":1857,"w":"riparare","m":"opravit","s1":"Il meccanico ripara la mia macchina.","t1":"Mechanik opravuje moje auto.","s2":"Non so riparare questo problema da solo.","t2":"Neumím tento problém opravit sám."},{"r":1858,"w":"rovinare","m":"zničit, pokazit","s1":"La pioggia ha rovinato la festa.","t1":"Déšť zničil oslavu.","s2":"Non voglio rovinare la sorpresa.","t2":"Nechci pokazit překvapení."},{"r":1859,"w":"asciugare","m":"osušit","s1":"Asciuga i capelli prima di uscire.","t1":"Usuš si vlasy, než vyjdeš ven.","s2":"Il sole asciuga i panni velocemente.","t2":"Slunce rychle usuší prádlo."},{"r":1860,"w":"bagnare","m":"namočit","s1":"Non bagnare il libro con l'acqua.","t1":"Nenamáčej knihu do vody.","s2":"La pioggia ha bagnato tutta la strada.","t2":"Déšť namočil celou ulici."},{"r":1861,"w":"possedere","m":"vlastnit","s1":"La mia famiglia possiede una piccola casa.","t1":"Moje rodina vlastní malý dům.","s2":"Non possiedo molte cose di valore.","t2":"Nevlastním mnoho cenných věcí."},{"r":1862,"w":"mancare","m":"chybět, scházet","s1":"Mi manchi molto quando sei via.","t1":"Moc mi chybíš, když jsi pryč.","s2":"Manca ancora un mese all'esame.","t2":"Do zkoušky ještě chybí měsíc."},{"r":1863,"w":"servire","m":"sloužit, být potřeba","s1":"Mi serve un consiglio urgente.","t1":"Potřebuji naléhavou radu.","s2":"Il cameriere serve il caffè al tavolo.","t2":"Číšník servíruje kávu u stolu."},{"r":1864,"w":"bastare","m":"stačit","s1":"Basta un minuto per spiegare tutto.","t1":"Stačí minuta na to, aby se všechno vysvětlilo.","s2":"Non mi bastano i soldi per il biglietto.","t2":"Nemám dost peněz na lístek."},{"r":1865,"w":"arrabbiarsi","m":"rozzlobit se","s1":"Mio padre si arrabbia se arrivo tardi.","t1":"Můj táta se zlobí, když přijdu pozdě.","s2":"Non voglio arrabbiarmi per una sciocchezza.","t2":"Nechci se zlobit kvůli hlouposti."},{"r":1866,"w":"innamorarsi","m":"zamilovat se","s1":"Si sono innamorati al primo sguardo.","t1":"Zamilovali se na první pohled.","s2":"È facile innamorarsi in vacanza.","t2":"Na dovolené je snadné se zamilovat."},{"r":1867,"w":"sposarsi","m":"vzít se, oženit se","s1":"Vogliono sposarsi il prossimo anno.","t1":"Chtějí se vzít příští rok.","s2":"Mia sorella si è sposata in chiesa.","t2":"Moje sestra se vdala v kostele."},{"r":1868,"w":"nascondere","m":"schovat","s1":"Ho nascosto il regalo nell'armadio.","t1":"Schoval jsem dárek do skříně.","s2":"I bambini amano nascondersi in giardino.","t2":"Děti si rády hrají na schovávanou na zahradě."},{"r":1869,"w":"rubare","m":"ukrást","s1":"Qualcuno ha rubato la mia bicicletta.","t1":"Někdo mi ukradl kolo.","s2":"Non bisogna rubare le cose degli altri.","t2":"Nesmí se krást věci ostatních."},{"r":1870,"w":"uccidere","m":"zabít","s1":"Il gatto ha ucciso un topo.","t1":"Kočka zabila ":1983,"w":"la periferia","m":"okraj města, periferie","s1":"Vivo in periferia, lontano dal centro.","t1":"Bydlím na periferii, daleko od centra.","s2":"La periferia è più tranquilla del centro.","t2":"Periferie je klidnější než centrum."},{"r":1984,"w":"il secolo","m":"století","s1":"Questo palazzo ha più di un secolo.","t1":"Tato budova je stará přes sto let.","s2":"Nel secolo scorso tutto era diverso.","t2":"V minulém století bylo všechno jiné."},{"r":1985,"w":"l'attimo","m":"okamžik","s1":"Aspetta un attimo, arrivo subito.","t1":"Počkej chvilku, hned přijdu.","s2":"In quell'attimo ho capito tutto.","t2":"V tom okamžiku jsem všemu porozuměl."},{"r":1986,"w":"la mezzanotte","m":"půlnoc","s1":"La festa finisce a mezzanotte.","t1":"Oslava končí o půlnoci.","s2":"Siamo tornati a casa dopo mezzanotte.","t2":"Vrátili jsme se domů po půlnoci."},{"r":1987,"w":"il mezzogiorno","m":"poledne","s1":"Ci vediamo a mezzogiorno per pranzo.","t1":"Uvidíme se v poledne na oběd.","s2":"Il negozio chiude a mezzogiorno.","t2":"Obchod zavírá v poledne."},{"r":1988,"w":"il ritardo","m":"zpoždění","s1":"Il treno ha un'ora di ritardo.","t1":"Vlak má hodinu zpoždění.","s2":"Scusa il ritardo, c'era traffico.","t2":"Omlouvám se za zpoždění, byla doprava."},{"r":1989,"w":"il legno","m":"dřevo","s1":"Questo tavolo è fatto di legno.","t1":"Tento stůl je vyrobený ze dřeva.","s2":"Il fuoco ha bisogno di legno secco.","t2":"Oheň potřebuje suché dřevo."},{"r":1990,"w":"il metallo","m":"kov","s1":"Questa sedia è di metallo.","t1":"Tato židle je z kovu.","s2":"Il metallo diventa caldo al sole.","t2":"Kov se na slunci zahřeje."},{"r":1991,"w":"il vetro","m":"sklo","s1":"La finestra ha il vetro rotto.","t1":"Okno má rozbité sklo.","s2":"Questo bicchiere è di vetro fine.","t2":"Tato sklenice je z jemného skla."},{"r":1992,"w":"la plastica","m":"plast","s1":"Questa bottiglia è di plastica.","t1":"Tato láhev je z plastu.","s2":"Dobbiamo riciclare la plastica.","t2":"Musíme recyklovat plast."},{"r":1993,"w":"il ferro","m":"železo","s1":"Il cancello è fatto di ferro.","t1":"Brána je vyrobená ze železa.","s2":"Questo ponte è costruito in ferro.","t2":"Tento most je postavený ze železa."},{"r":1994,"w":"l'oro","m":"zlato","s1":"Questo anello è d'oro puro.","t1":"Tento prsten je z ryzího zlata.","s2":"L'oro è un metallo molto prezioso.","t2":"Zlato je velmi vzácný kov."},{"r":1995,"w":"l'argento","m":"stříbro","s1":"Ha una collana d'argento.","t1":"Má stříbrný náhrdelník.","s2":"L'argento costa meno dell'oro.","t2":"Stříbro stojí méně než zlato."},{"r":1996,"w":"la lana","m":"vlna (materiál)","s1":"Questo maglione è di lana pura.","t1":"Tento svetr je z čisté vlny.","s2":"In inverno preferisco vestiti di lana.","t2":"V zimě dávám přednost vlněnému oblečení."},{"r":1997,"w":"il cotone","m":"bavlna","s1":"Questa maglietta è di cotone.","t1":"Toto tričko je z bavlny.","s2":"Il cotone è comodo d'estate.","t2":"Bavlna je pohodlná v létě."},{"r":1998,"w":"la ginnastica","m":"gymnastika","s1":"Mia figlia fa ginnastica due volte a settimana.","t1":"Moje dcera chodí na gymnastiku dvakrát týdně.","s2":"Facciamo un po' di ginnastica ogni mattina.","t2":"Každé ráno trochu cvičíme."},{"r":1999,"w":"l'atletica","m":"atletika","s1":"Pratica atletica da quando era bambino.","t1":"Věnuje se atletice od dětství.","s2":"L'atletica è il suo sport preferito.","t2":"Atletika je jeho oblíbený sport."},{"r":2000,"w":"l'umidità","m":"vlhkost","s1":"Oggi c'è molta umidità nell'aria.","t1":"Dnes je ve vzduchu velká vlhkost.","s2":"L'umidità rende l'estate più difficile.","t2":"Vlhkost dělá léto obtížnější."}]</script>
<script>
(function(){
  var WORDS = JSON.parse(document.getElementById('data').textContent);

  // flatten the two example sentences of every word into one flashcard-able list
  var SENTENCES = [];
  WORDS.forEach(function(w){
    SENTENCES.push({ n: SENTENCES.length + 1, it: w.s1, cz: w.t1, w: w.w, m: w.m });
    SENTENCES.push({ n: SENTENCES.length + 1, it: w.s2, cz: w.t2, w: w.w, m: w.m });
  });

  var contentType = 'words';   // 'words' | 'sentences'
  var direction = 'it2cz';     // 'it2cz' | 'cz2it' (sentences mode only)
  var mode = 'random';         // 'random' | 'seq'
  var curIndex = 0;
  var flipped = false;

  var elCard = document.getElementById('card');
  var elFront = document.getElementById('front');
  var elBack = document.getElementById('back');
  var elWord = document.getElementById('wordText');
  var elHint = document.getElementById('hintText');
  var elMeaning = document.getElementById('meaningText');
  var elExamples = document.getElementById('examplesBlock');
  var elS1 = document.getElementById('s1');
  var elT1 = document.getElementById('t1');
  var elS2 = document.getElementById('s2');
  var elT2 = document.getElementById('t2');
  var elSource = document.getElementById('sentenceSource');
  var elRank = document.getElementById('rankBadge');
  var elFill = document.getElementById('progressFill');
  var elPrev = document.getElementById('prevBtn');
  var elNext = document.getElementById('nextBtn');
  var elRefresh = document.getElementById('refreshBtn');
  var elTypeWords = document.getElementById('typeWords');
  var elTypeSentences = document.getElementById('typeSentences');
  var elDirRow = document.getElementById('dirRow');
  var elDirItCz = document.getElementById('dirItCz');
  var elDirCzIt = document.getElementById('dirCzIt');
  var elModeRandom = document.getElementById('modeRandom');
  var elModeSeq = document.getElementById('modeSeq');
  var elSettingsBtn = document.getElementById('settingsBtn');
  var elSettingsOverlay = document.getElementById('settingsOverlay');
  var elCloseSettings = document.getElementById('closeSettings');

  function activeList(){ return contentType === 'words' ? WORDS : SENTENCES; }
  function activeTotal(){ return activeList().length; }

  function randomIndex(excludeIndex){
    var total = activeTotal();
    if (total <= 1) return 0;
    var i;
    do { i = Math.floor(Math.random() * total); } while (i === excludeIndex);
    return i;
  }

  function setFlipped(v){
    flipped = v;
    elBack.classList.toggle('show', flipped);
    elFront.classList.toggle('hide', flipped);
    elCard.scrollTop = 0;
  }

  function renderAtIndex(idx, resetFlip){
    var total = activeTotal();
    idx = Math.max(0, Math.min(total - 1, idx));
    curIndex = idx;

    if (contentType === 'words') {
      var w = WORDS[idx];
      elWord.classList.remove('is-sentence');
      elWord.textContent = w.w;
      elHint.textContent = 'ťukni pro překlad a věty';
      elMeaning.textContent = w.m;
      elS1.textContent = w.s1;
      elT1.textContent = w.t1;
      elS2.textContent = w.s2;
      elT2.textContent = w.t2;
      elExamples.style.display = '';
      elSource.style.display = 'none';
      elRank.textContent = '#' + w.r + ' / ' + total;
      elFill.style.width = (w.r / total * 100).toFixed(1) + '%';
    } else {
      var s = SENTENCES[idx];
      var front = direction === 'it2cz' ? s.it : s.cz;
      var back = direction === 'it2cz' ? s.cz : s.it;
      elWord.classList.add('is-sentence');
      elWord.textContent = front;
      elHint.textContent = 'ťukni pro překlad';
      elMeaning.textContent = back;
      elExamples.style.display = 'none';
      elSource.style.display = '';
      elSource.textContent = 'ze slova „' + s.w + '“ (' + s.m + ')';
      elRank.textContent = '#' + s.n + ' / ' + total;
      elFill.style.width = (s.n / total * 100).toFixed(1) + '%';
    }
    if (resetFlip !== false) setFlipped(false);
  }

  function showRandom(){ renderAtIndex(randomIndex(curIndex), true); }

  function goNext(){
    if (mode === 'seq') renderAtIndex((curIndex + 1) % activeTotal(), true);
    else showRandom();
  }

  function goPrev(){
    if (mode === 'seq') renderAtIndex((curIndex - 1 + activeTotal()) % activeTotal(), true);
    else showRandom();
  }

  function setMode(newMode){
    mode = newMode;
    elModeRandom.classList.toggle('active', mode === 'random');
    elModeSeq.classList.toggle('active', mode === 'seq');
  }

  function setContentType(t){
    contentType = t;
    elTypeWords.classList.toggle('active', t === 'words');
    elTypeSentences.classList.toggle('active', t === 'sentences');
    elDirRow.style.display = t === 'sentences' ? '' : 'none';
    renderAtIndex(randomIndex(-1), true);
  }

  function setDirection(d){
    direction = d;
    elDirItCz.classList.toggle('active', d === 'it2cz');
    elDirCzIt.classList.toggle('active', d === 'cz2it');
    renderAtIndex(curIndex, true);
  }

  elCard.addEventListener('click', function(){ setFlipped(!flipped); });
  elRefresh.addEventListener('click', function(){
    if (mode === 'seq') renderAtIndex((curIndex + 1) % activeTotal(), true);
    else showRandom();
  });
  elNext.addEventListener('click', goNext);
  elPrev.addEventListener('click', goPrev);
  elModeRandom.addEventListener('click', function(){ setMode('random'); });
  elModeSeq.addEventListener('click', function(){ setMode('seq'); renderAtIndex(curIndex, true); });
  elTypeWords.addEventListener('click', function(){ setContentType('words'); });
  elTypeSentences.addEventListener('click', function(){ setContentType('sentences'); });
  elDirItCz.addEventListener('click', function(){ setDirection('it2cz'); });
  elDirCzIt.addEventListener('click', function(){ setDirection('cz2it'); });

  function openSettings(){ elSettingsOverlay.hidden = false; }
  function closeSettings(){ elSettingsOverlay.hidden = true; }
  elSettingsBtn.addEventListener('click', openSettings);
  elCloseSettings.addEventListener('click', closeSettings);
  elSettingsOverlay.addEventListener('click', function(e){
    if (e.target === elSettingsOverlay) closeSettings();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { closeSettings(); return; }
    if (!elSettingsOverlay.hidden) return; // don't drive cards while settings is open
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); setFlipped(!flipped); }
    else if (e.key === 'ArrowRight') { goNext(); }
    else if (e.key === 'ArrowLeft') { goPrev(); }
    else if (e.key === 'r' || e.key === 'R') { showRandom(); }
  });

  // --- swipe gestures (mobile): swipe left/right = next/previous, tap = flip ---
  var touchStartX = 0, touchStartY = 0;
  var SWIPE_THRESHOLD = 55;

  elCard.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  elCard.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    // only treat as a horizontal swipe if it's clearly more horizontal than vertical,
    // and the card wasn't just being scrolled vertically
    if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.4 && Math.abs(dy) < 60) {
      e.preventDefault();
      if (dx < 0) goNext(); else goPrev();
    }
  }, { passive: false });

  setMode('random');
  renderAtIndex(randomIndex(-1), true);
})();
</script>
</body>
</html>
